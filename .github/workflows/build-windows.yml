name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app_v5.py

      - name: Self test
        run: python app_v5.py --self-test

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SYCM_Collector_API_V5 --collect-all playwright --collect-all openpyxl app_v5.py

      - name: Verify artifact
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/SYCM_Collector_API_V5.exe')) { throw 'EXE not created' }
          $size = (Get-Item 'dist/SYCM_Collector_API_V5.exe').Length
          Write-Host "EXE size: $size bytes"
          if ($size -lt 1000000) { throw 'EXE unexpectedly small' }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SYCM_Collector_API_V5_Windows
          path: dist/SYCM_Collector_API_V5.exe
          if-no-files-found: error
